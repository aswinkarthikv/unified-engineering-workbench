<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b0f19; }
      .box { rx: 8; stroke-width: 2; }
      .host-box { fill: #1e293b; stroke: #38bdf8; }
      .mcu-box { fill: #064e3b; stroke: #10b981; }
      .fpga-box { fill: #78350f; stroke: #f59e0b; }
      .jtag-box { fill: #4c1d95; stroke: #8b5cf6; }
      .level-shift-box { fill: #1f2937; stroke: #9ca3af; stroke-dasharray: 4 2; }
      .text-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; font-weight: bold; fill: #ffffff; }
      .text-sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; fill: #94a3b8; }
      .text-spec { font-family: Consolas, monospace; font-size: 10.5px; fill: #e2e8f0; }
      .wire-usb { stroke: #38bdf8; stroke-width: 2; fill: none; }
      .wire-jtag { stroke: #c084fc; stroke-width: 2; stroke-dasharray: 5 3; fill: none; }
      .wire-pwr { stroke: #ef4444; stroke-width: 2; fill: none; }
      .wire-gnd { stroke: #64748b; stroke-width: 2; stroke-dasharray: 3 3; fill: none; }
      .arrow { fill: #38bdf8; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" class="bg"/>

  <!-- Title Banner -->
  <text x="450" y="32" text-anchor="middle" class="text-title" font-size="17">MODULAR HOST-CONNECTED EMBEDDED WORKBENCH ARCHITECTURE</text>
  <text x="450" y="50" text-anchor="middle" class="text-sub">Hardware Integration &bull; Power Domains &bull; Signal Ownership &bull; Debug Interfacing</text>

  <!-- Host PC Box -->
  <rect x="250" y="70" width="400" height="90" class="box host-box"/>
  <text x="450" y="98" text-anchor="middle" class="text-title">Host PC / Workstation (Windows 11 x64)</text>
  <text x="450" y="118" text-anchor="middle" class="text-sub">Unified Engineering Workbench Core &bull; Native C++17 Process &bull; WinSock2 REST/API</text>
  <text x="450" y="138" text-anchor="middle" class="text-spec">USB-C Hub / Host Ports &bull; 5.0V VBUS Supply &bull; Chassis Ground Plane</text>

  <!-- Host USB Interconnects -->
  <!-- Port 1: MCU -->
  <path d="M 320 160 L 320 230 L 150 230 L 150 270" class="wire-usb" marker-end="url(#arrow-blue)"/>
  <text x="215" y="215" class="text-spec" fill="#38bdf8">USB CDC-ACM (921.6k baud)</text>

  <!-- Port 2: FPGA -->
  <path d="M 450 160 L 450 270" class="wire-usb" marker-end="url(#arrow-blue)"/>
  <text x="458" y="215" class="text-spec" fill="#38bdf8">FT2232H High-Speed USB FIFO</text>

  <!-- Port 3: JTAG -->
  <path d="M 580 160 L 580 230 L 750 230 L 750 270" class="wire-usb" marker-end="url(#arrow-blue)"/>
  <text x="610" y="215" class="text-spec" fill="#38bdf8">USB 2.0 Bulk Endpoints (ST-Link)</text>

  <!-- Device 1: Microcontroller Box -->
  <rect x="50" y="270" width="220" height="190" class="box mcu-box"/>
  <text x="160" y="295" text-anchor="middle" class="text-title">1. Microcontroller Board</text>
  <text x="160" y="312" text-anchor="middle" class="text-sub">STM32H753ZI (Cortex-M7 @ 480MHz)</text>
  <line x1="65" y1="322" x2="255" y2="322" stroke="#10b981" stroke-width="1"/>
  <text x="65" y="340" class="text-spec">&bull; Power: 5V VBUS &rarr; 3.3V LDO</text>
  <text x="65" y="358" class="text-spec">&bull; Core Logic: 3.3V LVCMOS / 1.2V Core</text>
  <text x="65" y="376" class="text-spec">&bull; Ground: Common Chassis GND</text>
  <text x="65" y="394" class="text-spec">&bull; Task: RTOS Sensor Fusion &amp; PID</text>
  <text x="65" y="412" class="text-spec">&bull; JTAG Role: SLAVE (SWD Target)</text>
  <text x="65" y="430" class="text-spec">&bull; Connectors: USB Micro-B, Morpho</text>

  <!-- Device 2: FPGA Box -->
  <rect x="340" y="270" width="220" height="190" class="box fpga-box"/>
  <text x="450" y="295" text-anchor="middle" class="text-title">2. FPGA Board</text>
  <text x="450" y="312" text-anchor="middle" class="text-sub">Xilinx Artix-7 XC7A35T (Basys 3)</text>
  <line x1="355" y1="322" x2="545" y2="322" stroke="#f59e0b" stroke-width="1"/>
  <text x="355" y="340" class="text-spec">&bull; Power: 5V Ext/USB &rarr; PMIC Rails</text>
  <text x="355" y="358" class="text-spec">&bull; Rails: 1.0V VCCINT, 1.8V VCCAUX</text>
  <text x="355" y="376" class="text-spec">&bull; Bank I/O: 3.3V VCCO Domains</text>
  <text x="355" y="394" class="text-spec">&bull; Shifter: TXS0108E Level Translators</text>
  <text x="355" y="412" class="text-spec">&bull; JTAG Role: SLAVE (IEEE 1149.1 TAP)</text>
  <text x="355" y="430" class="text-spec">&bull; Connectors: USB-B, 4x PMOD, JTAG</text>

  <!-- Device 3: JTAG Debug Adapter Box -->
  <rect x="630" y="270" width="230" height="190" class="box jtag-box"/>
  <text x="745" y="295" text-anchor="middle" class="text-title">3. JTAG Debug Adapter</text>
  <text x="745" y="312" text-anchor="middle" class="text-sub">ST-Link V3 / Segger J-Link Probe</text>
  <line x1="645" y1="322" x2="845" y2="322" stroke="#8b5cf6" stroke-width="1"/>
  <text x="645" y="340" class="text-spec">&bull; Power: Host USB 5.0V powered</text>
  <text x="645" y="358" class="text-spec">&bull; Target VREF: 1.65V - 3.6V (Passive Sense)</text>
  <text x="645" y="376" class="text-spec">&bull; Signals: TCK, TMS, TDI, TDO, nSRST</text>
  <text x="645" y="394" class="text-spec" font-weight="bold" fill="#f43f5e">&bull; BUS MASTER: Drives State Machine</text>
  <text x="645" y="412" class="text-spec" fill="#c084fc">&bull; NOT a general compute board!</text>
  <text x="645" y="430" class="text-spec">&bull; Connector: 10-pin 0.05" Samtec FTSH</text>

  <!-- JTAG Bus Connection to Targets -->
  <path d="M 630 380 L 560 380" class="wire-jtag" marker-end="url(#arrow-purple)"/>
  <text x="595" y="373" text-anchor="middle" class="text-spec" fill="#c084fc">JTAG</text>

  <path d="M 745 460 L 745 490 L 160 490 L 160 460" class="wire-jtag" marker-end="url(#arrow-purple)"/>
  <text x="450" y="485" text-anchor="middle" class="text-spec" fill="#c084fc">Dedicated SWD / Debug Ribbon: SWCLK, SWDIO, nRST, GND, Target VREF</text>
</svg>
